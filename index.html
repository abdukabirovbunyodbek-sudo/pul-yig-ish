
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pul to‘plash</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
</head>
<body>

    <header class="navbar">
        <a href="#" class="logo">💰 Pul to‘plash</a>
        <a href="https://t.me/abdukabirov_08" class="telegram-top">
            Telegram
        </a>
    </header>

    <main>
        <section class="hero">
            <span class="hero-icon">🎯</span>
            <h1>Maqsading sari <span>bir qadam!</span></h1>
            <p>Pulingni boshqar, maqsadlaringni belgilab, orzularingga erish.</p>
        </section>

        <section class="auth-card">
            <div class="card-icon">👋</div>
            <h2>Hisobingga kir</h2>
            <p class="subtitle">Pul to‘plashni davom ettir</p>

            <form id="login-form">
                <label for="email">Email manziling</label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
                >

                <label for="password">Paroling</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Parolingni kiriting"
                    required
                >

                <button type="submit" id="login-button">
                    Hisobga kirish
                </button>
            </form>

            <p id="auth-message" aria-live="polite"></p>

            <a href="#" id="reset-password" class="reset-link">
                Parolni unutdingmi?
            </a>

            <div class="divider">
                <span>yoki</span>
            </div>

            <button id="register-button" class="register-button">
                Yangi hisob yaratish
            </button>

            <p class="help-text">
                Muammo bo‘lsa, Telegram orqali yordam olishing mumkin.
            </p>
        </section>

        <footer>
            <p>© 2026 Pul to‘plash. Barcha huquqlar himoyalangan.</p>
        </footer>
    </main>

</body>
</html>
